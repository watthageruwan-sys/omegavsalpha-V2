<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About — Grade 12 Study Group Initiative</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#122A5E;
    --navy-deep:#0B1E45;
    --gold:#F2B705;
    --blue:#1E3A8A;
    --teal:#0E6E6E;
    --ink:#122A5E;
    --gray:#5B6478;
    --paper:#FFFFFF;
    --mist:#F6F7FA;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    overflow-x:hidden;
    position:relative;
  }
  h1,h2,h3{font-family:'Poppins',sans-serif;margin:0;}

  .arc-top{
    position:fixed;top:-260px;right:-220px;width:640px;height:640px;
    border-radius:50%;
    background:conic-gradient(from 220deg, var(--gold) 0deg, var(--gold) 14deg, transparent 15deg);
    z-index:0;pointer-events:none;
  }
  .arc-top::after{
    content:'';position:absolute;inset:26px;border-radius:50%;
    background:var(--navy);
  }
  .dot-grid{
    position:fixed;top:40px;right:60px;width:220px;height:220px;z-index:0;pointer-events:none;
    background-image:radial-gradient(rgba(18,42,94,.18) 2px, transparent 2px);
    background-size:20px 20px;
    -webkit-mask-image:linear-gradient(135deg, black 30%, transparent 75%);
    mask-image:linear-gradient(135deg, black 30%, transparent 75%);
  }
  .arc-bottom{
    position:fixed;bottom:-300px;left:-260px;width:620px;height:620px;
    border-radius:50%;z-index:0;pointer-events:none;
    background:conic-gradient(from 30deg, var(--gold) 0deg, var(--gold) 10deg, transparent 11deg);
  }
  .arc-bottom::after{
    content:'';position:absolute;inset:22px;border-radius:50%;background:var(--navy-deep);
  }

  .page{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:40px 28px 90px;}

  /* NAV */
  .nav-bar{display:flex;justify-content:center;gap:12px;margin-bottom:36px;flex-wrap:wrap;}
  .nav-btn{
    background:#fff;border:1.5px solid #E3E6EE;color:var(--navy);
    padding:9px 20px;border-radius:20px;font-weight:600;font-size:0.9rem;
    text-decoration:none;transition:all 0.2s;
  }
  .nav-btn:hover{border-color:var(--gold);transform:translateY(-1px);}
  .nav-btn.active{background:var(--navy-deep);border-color:var(--navy-deep);color:#fff;}

  /* HEADER */
  .header{display:flex;align-items:flex-start;gap:22px;margin-bottom:8px;}
  .trophy-badge{width:78px;height:78px;flex:none;display:flex;align-items:center;justify-content:center;}
  .header-text .kicker{
    font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.15em;text-transform:uppercase;
    color:var(--gray);font-weight:600;
  }
  .header-text h1{
    font-size:clamp(28px,4.6vw,42px);font-weight:800;color:var(--navy);line-height:1.05;margin-top:6px;
  }
  .underline{width:70px;height:4px;background:var(--gold);border-radius:2px;margin-top:14px;}
  .subtitle{color:var(--gray);font-size:16px;margin-top:16px;max-width:560px;}

  .section-block{margin-top:52px;}
  .section-kicker{
    font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--gold);font-weight:600;
  }
  .section-title{font-size:clamp(22px,3vw,28px);color:var(--navy);font-weight:700;margin-top:8px;margin-bottom:22px;}
  .section-lede{color:var(--gray);font-size:14.5px;margin-top:-14px;margin-bottom:24px;max-width:600px;}

  /* Challenge */
  .challenge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  @media (max-width:760px){.challenge-grid{grid-template-columns:1fr;}}
  .challenge-card{
    background:var(--mist);border-radius:14px;padding:22px 20px;
    box-shadow:0 10px 26px -20px rgba(18,42,94,.4);
  }
  .icon-box.small{width:44px;height:44px;border-radius:10px;margin-bottom:14px;display:flex;align-items:center;justify-content:center;}
  .icon-box.c-navy{background:var(--navy-deep);}
  .icon-box.c-blue{background:var(--blue);}
  .icon-box.c-teal{background:var(--teal);}
  .icon-box .glyph{font-family:'Poppins',sans-serif;font-weight:800;font-size:20px;color:var(--gold);}
  .challenge-card h3{font-size:16.5px;color:var(--navy);font-weight:700;}
  .challenge-card p{font-size:13.5px;color:var(--gray);margin-top:6px;line-height:1.5;}

  /* Objective */
  .objective-list{list-style:none;margin:0;padding:0;}
  .objective-list li{
    display:flex;gap:16px;padding:16px 4px;border-top:1px solid #E3E6EE;font-size:14.5px;color:var(--ink);
  }
  .objective-list li:last-child{border-bottom:1px solid #E3E6EE;}
  .objective-list .idx{font-family:'IBM Plex Mono',monospace;color:var(--gold);font-weight:700;font-size:13px;padding-top:1px;}

  /* Leadership */
  .leader-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media (max-width:760px){.leader-grid{grid-template-columns:1fr;}}
  .leader-col{
    background:var(--navy-deep);border:1.5px solid var(--gold);border-radius:16px;padding:22px;
  }
  .leader-col-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .leader-badge{
    width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    font-family:'Poppins',sans-serif;font-weight:800;font-size:16px;color:var(--navy-deep);
    background:linear-gradient(135deg,#F2B705,#D99A00);
  }
  .leader-col-head h3{color:var(--gold);font-size:19px;font-weight:700;}
  .role-item{
    display:flex;align-items:center;gap:12px;padding:11px 0;
    border-bottom:1px solid rgba(242,183,5,.18);color:#fff;font-size:14px;
  }
  .role-item:last-child{border-bottom:none;}
  .role-label{font-weight:600;min-width:160px;}

  /* Duties */
  .duties-strip{
    margin-top:26px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;
  }
  @media (max-width:760px){.duties-strip{grid-template-columns:1fr 1fr;}}
  @media (max-width:480px){.duties-strip{grid-template-columns:1fr;}}
  .duty-item{
    background:var(--mist);border:1px solid #E3E6EE;border-radius:12
