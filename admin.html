<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <style>
    /* --- OG Admin Panel Styling --- */
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--card-bg);
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .container {
      max-width: 1100px;
      width: 100%;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    /* --- Auth Gateway Overlay / Card --- */
    #auth-screen {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2.5rem;
      max-width: 420px;
      margin: 4rem auto;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    #auth-screen h2 {
      margin-bottom: 0.5rem;
      font-size: 1.4rem;
    }

    #auth-screen p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    input[type="password"] {
      width: 100%;
      padding: 0.75rem 1rem;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="password"]:focus {
      border-color: var(--accent);
    }

    .btn {
      padding: 0.75rem 1.25rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .error-msg {
      color: var(--danger);
      font-size: 0.85rem;
      margin-top: 0.75rem;
      display: none;
    }

    /* --- Admin Content (Hidden by default) --- */
    #admin-content {
      display: none; /* Everything hidden until unlocked */
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-top: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
    }

    .card h3 {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .card .stat {
      font-size: 1.8rem;
      font-weight: bold;
    }

    .actions-panel {
      margin-top: 2rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
    }

    .actions-grid {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }

    .btn-secondary {
      background: #334155;
    }
  </style>
</head>
<body>

  <header>
    <h1>Admin Control Panel</h1>
    <button id="logout-btn" class="btn btn-secondary" style="display: none;" onclick="lockPanel()">Lock Panel</button>
  </header>

  <div class="container">
    
    <!-- Password Prompt Gate -->
    <div id="auth-screen">
      <h2>Restricted Access</h2>
      <p>Enter the administrator password to unlock options.</p>
      <div class="input-group">
        <input type="password" id="admin-pass" placeholder="Enter Password..." onkeydown="checkEnter(event)">
        <button class="btn" onclick="unlockPanel()">Unlock</button>
      </div>
      <div id="error-msg" class="error-msg">Incorrect password. Access denied.</div>
    </div>

    <!-- Hidden Admin Panel Options & Content -->
    <div id="admin-content">
      
      <h2>Dashboard Overview</h2>
      
      <div class="dashboard-grid">
        <div class="card">
          <h3>System Status</h3>
          <div class="stat" style="color: #10b981;">Online</div>
        </div>
        <div class="card">
          <h3>Active Connections</h3>
          <div class="stat">24</div>
        </div>
        <div class="card">
          <h3>CPU Usage</h3>
          <div class="stat">12%</div>
        </div>
      </div>

      <div class="actions-panel">
        <h3>Administrative Controls</h3>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Manage features and system functions below.</p>
        
        <div class="actions-grid">
          <button class="btn" onclick="alert('Action triggered: Restart Service')">Restart Services</button>
          <button class="btn" onclick="alert('Action triggered: Clear Cache')">Clear Cache</button>
          <button class="btn btn-secondary" onclick="alert('Action triggered: Export Logs')">Export Logs</button>
        </div>
      </div>

    </div>

  </div>

  <script>
    // --- Configurable Password ---
    const ADMIN_PASSWORD = "admin"; // Set your password here

    function unlockPanel() {
      const input = document.getElementById("admin-pass");
      const error = document.getElementById("error-msg");
      const authScreen = document.getElementById("auth-screen");
      const adminContent = document.getElementById("admin-content");
      const logoutBtn = document.getElementById("logout-btn");

      if (input.value === ADMIN_PASSWORD) {
        // Hide password prompt
        authScreen.style.display = "none";
        
        // Unhide all admin panel options & controls
        adminContent.style.display = "block";
        logoutBtn.style.display = "inline-block";
        
        // Reset inputs & error states
        input.value = "";
        error.style.display = "none";
      } else {
        error.style.display = "block";
        input.value = "";
        input.focus();
      }
    }

    function lockPanel() {
      document.getElementById("auth-screen").style.display = "block";
      document.getElementById("admin-content").style.display = "none";
      document.getElementById("logout-btn").style.display = "none";
    }

    function checkEnter(event) {
      if (event.key === "Enter") {
        unlockPanel();
      }
    }
  </script>
</body>
</html>
